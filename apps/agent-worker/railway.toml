# Select this config file explicitly for a separately approved WORKER service.
# Build context is the repository root, not apps/agent-worker.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/agent-worker/Dockerfile"
watchPatterns = ["apps/agent-worker/**", "packages/**", "package.json", "package-lock.json", "tsconfig.json"]

[deploy]
startCommand = "node --import tsx apps/agent-worker/src/index.ts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# One replica / shared volume must be configured by the owner. No public domain.
